conference:
  name: acl
  year: "2023"
  paper_type: long
  total_num: 911

paths:
  papers_root: data/raw/papers
  checklists_root: data/raw/checklists
  parses_root: data/interim/parses
  sections_root: data/interim/sections
  checklist_parse_root: data/interim/checklist_parse
  metadata_root: data/external/metadata
  acl_metadata_root: data/external/metadata/acl
  openalex_root: data/external/metadata/openalex
  semantic_scholar_root: data/external/metadata/semantic_scholar
  reference_metadata_root: data/interim/reference_metadata
  merged_metadata_root: data/processed/merged
  gpu_root: data/processed/gpu
  gpu_rules_path: config/gpu_section_rules.yaml
  affiliations_root: data/processed/affiliations
  logs_root: artifacts/logs
  tmp_root: artifacts/tmp

pipeline:
  sleep_seconds: 1.0

llm:
  provider: openrouter
  model: gpt-4o-mini
  api_base: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  model_aliases:
    gpt40mini: gpt4omini
    llavaov: llavaonevision
    qwen25vl: qwen25vl
