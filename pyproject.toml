[project]
name = "computational-resources-paper-results"
version = "1.0.0"
description = "Offline result reproduction for reported computational resources and scholarly impact in NLP papers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "firthmodels[formula]>=0.3,<0.4",
    "matplotlib>=3.8,<3.10",
    "numpy>=1.26,<2.0",
    "openpyxl>=3.1,<4",
    "pandas>=2.1,<2.3",
    "pillow>=10,<12",
    "scipy>=1.11,<1.15",
    "statsmodels>=0.14.4,<0.14.5",
    "tabulate>=0.9,<0.10",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
